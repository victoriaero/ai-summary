in"><meta property="og:image" content="http://images.tandf.co.uk/common/jackets/crclarge/978100305/9781003051923.jpg"><meta property="og:image:secure_url" content="https://images.tandf.co.uk/common/jackets/crclarge/978100305/9781003051923.jpg"><meta property="og:image:alt" content="Human Resource Perspectives on Workplace Bullying in Higher Education"><meta property="books:isbn" content="9781003051923"><meta property="books:page_count" content="216"><meta name="audience" content="all"><meta name="distribution" content="global"><meta name="citation_title" content="Human Resource Perspectives on Workplace Bullying in Higher Education : Understanding Vulnerable Employees' Experiences"><meta name="citation_publication_date" content="2021/05/12"><meta name="citation_isbn" content="9781003051923"><meta name="citation_publisher" content="Routledge"><meta name="citation_pdf_url" content="https://api.taylorfrancis.com/content/books/mono/download?identifierName=doi&amp;identifierValue=10.4324/9781003051923&amp;type=googlepdf"><meta name="citation_doi" content="10.4324/9781003051923"><meta name="citation_abstract" content="This analytical volume uses qualitative data, quantitative data, and direct employee experiences to aid understanding of why workplace bullying occurs in universities throughout the US. To address higher education workplace bullying, this text offers data-driven interventions for human resource staff and departments to effectively tackle this destructive phenomenon. Drawing on Hollis’ first-hand research which is supported by findings from a 2019 Human Resources data collection, this text identifies populations which are most vulnerable to discrimination within academia. The data shows how human resource departments, executive leadership, and faculty might proactively intervene to prevent workplace bullying. Divided into two parts, the book offers empirical analysis of structural interventions for human resource efforts to combat workplace bullying in higher education. Second, the book puts forth solutions based on empirical findings for organizations and human resources to combat workplace aggression and civility which hurts higher education. Further, the author examines the specific effect of workplace harassment and cyberbullying on women of color, junior faculty, women, and the LGBTQ community. This text will benefit researchers, doctoral students, and conducting higher education research. Additionally, the book focusses on structural issues which interfere with multicultural education more broadly. Those interested in Human Resource Management, the sociology of education, and gender and sexuality studies and will also enjoy this volume."><meta property="citation_author" content="Leah P. Hollis"><meta property="citation_author" content="David C. Yamada"><meta name="citation_xml_url" content="https://api.taylorfrancis.com/content/books/mono/download?identifierName=doi&amp;identifierValue=10.4324/9781003051923&amp;type=bookxml"><meta name="citation_author_institution" content="Morgan State University, USA"><meta property="books:author" content="Leah P. Hollis"><meta property="books:author" content="David C. Yamada"></head>

esources to combat workplace aggression and civility which hurts higher education. Further, the author examines the specific effect of workplace harassment and cyberbullying on women of color, junior faculty, women, and the LGBTQ community.&l;/P&g;\n&l;P&g;&l;/P&g;\n&l;P&g;This text will benefit researchers, doctoral students, and conducting higher education research. Additionally, the book focusses on structural issues which interfere with multicultural education more broadly. Those interested in Human Resource Management, the sociology of education, and gender and sexuality studies and will also enjoy this volume. &l;/P&g;&q;,&q;publisherImprint&q;:&q;Routledge&q;,&q;publicationDate&q;:&q;2021-05-12T00:00:00.000Z&q;,&q;copyright&q;:{&q;holder&q;:&q;Taylor &a; Francis&q;,&q;year&q;:2021,&q;statement&q;:&q;© 2021 Taylor &a; Francis&q;},&q;edition&q;:1,&q;doiRegistrationStatus&q;:true,&q;firstPublishedYear&q;:&q;2021&q;,&q;plannedPublicationDate&q;:&q;2021-05-13T00:00:00.000Z&q;,&q;abstracts&q;:[{&q;type&q;:&q;xml&q;,&q;position&q;:0,&q;caption&q;:null,&q;transcript&q;:null,&q;textType&q;:&q;blurb&q;,&q;value&q;:&q;&l;p&g;This analytical volume uses qualitative data, quantitative data, and direct employee experiences to aid in the understanding of why workplace bullying occurs in universities throughout the United States. To address higher education workplace bullying, this text offers data-driven interventions for human resource staff and departments to effectively tackle this destructive phenomenon.&l;/p&g;\n         &l;p&g;Drawing on Hollis’ first-hand research which is supported by findings from a 2019 Human Resources data collection, this text identifies populations which are most vulnerable to discrimination within academia. The data shows how human resource departments, executive leadership, and faculty might proactively intervene to prevent workplace bullying. Divided into two parts, the book first offers an empirical analysis of structural interventions for human resource efforts to combat workplace bullying in higher education. Second, the book puts forth solutions based on empirical findings for organizations and human resources to combat workplace aggression and civility which hurts higher education. Further, the author examines the specific effect of workplace harassment and cyberbullying on women of color, junior faculty, women, and the LGBTQ community.&l;/p&g;\n         &l;p&g;This text will benefit researchers, doctoral students, and those conducting higher education research. Additionally, the book focuses on structural issues which interfere with multicultural education more broadly. Those interested in Human Resource Management, the sociology of education, and gender and sexuality studies will also enjoy this volume.&l;/p&g;&q;}],&q;citation&q;:&q;Hollis, L.P. (2021). Human Resource Perspectives on Workplace Bullying in Higher Education: Understanding Vulnerable Employees&s; Experiences (1st ed.). Routledge. https://doi.org/10.4324/9781003051923&q;,&q;bindingStyle&q;:&q;eBook - General&q;,&q;bindingStyleCode&q;:&q;EBGE&q;,&q;publicationLocation&q;:&q;New York&q;,&q;formerImprints&q;:[{&q;code&q;:null,&q;description&q;:null}],&q;formatCode&q;:&q;EBK&q;,&q;format&q;:&q;e-Book&q;,&q;textType&q;:&q;Monograph (DRM-Free)&q;,&q;publisherArea&q;:&q;Behavioural Science &a; Education&q;,&q;publisherAreaCode&q;:&q;BSCIED&q;,&q;status&q;:&q;Available&q;,&q;toc&q;:&q;&l;![CDATA[&l;P&g;Foreword by David C. Yamada&l;/P&g;\n&l;P&g;&l;/P&g;\n&l;P&g;Introduction &l;/P&g;\n&l;P&g;&l;/P&g;&l;U&g;\n&l;P&g;Part 1: Human Resources and Higher Education &l;/P&g;&l;/U&g;\n&l;P&g;&l;/P&g;\n&l;P&g;Chapter 1: Training Current HR Personnel for New Tricks: Analyzing the Relationship Between Training and Workplace Bullying. &l;/P&g;\n&l;P&g;&l;/P&g;\n&l;P&g;Chapter 2: Speaking for Themselves: The Voices of Human Resources Personnel Regarding Workplace Bullying in Higher Education &l;/P&g;\n&l;P&g;&l;/P&g;\n&l;P&g;Chapter 3: Is Bullying Bake s—&l;italic&g;RQ1: “Which schools, those that have traditional rules training for human resources or those without traditional training for human resources, are more likely to report higher than the median of three (3) workplace bullying complaints?”&l;/italic&g; and &l;italic&g;RQ2: Which schools, those with anti-bullying policies that specifically use the term “workplace bullying” or those without anti-bullying policies, are more likely to report higher than the median of three (3) workplace bullying complaints?”&l;/italic&g; Considering sociological theories on expert power, personal power, and organizational power, two of chi-squared analyses are conducted. The findings indicate that, as in the U.S. workplace bullying is not prohibited at the federal level, traditional rules training does not deter workplace bullying in higher education. However, when schools have institutional-level policy explicitly using the term “workplace bullying,” these policies have a statistically significant impact on suppressing the incidents of workplace bullying on campus.&l;/p&g;&q;}],&q;citation&q;:&q;&q;,&q;textType&q;:&q;Monograph (DRM-Free)&q;},&q;identifiers&q;:{&q;doi&q;:&q;10.4324/9781003051923-3&q;,&q;chapterId&q;:&q;chapter1&q;,&q;sku&q;:null},&q;label&q;:&q;1&q;,&q;pageStart&q;:&q;11&q;,&q;pageEnd&q;:&q;24&q;,&q;parentId&q;:&q;90b6d852-22cc-4864-9781-37144e7f1a2a&q;,&q;isFree&q;:false,&q;associatedMedia&q;:[{&q;_id&q;:&q;25dce7d7-13bc-43ce-915f-65fce7d40b66&q;,&q;type&q;:&q;chapterabstractxml&q;,&q;size&q;:1631,&q;location&q;:null},{&q;_id&q;:&q;25fc96f9-b4c5-4caa-b4db-ae43cb1ac5db&q;,&q;type&q;:&q;chapterabstractxml&q;,&q;size&q;:1141,&q;location&q;:null},{&q;_id&q;:&q;8233990d-9f85-47fb-8ec9-a188aef7536a&q;,&q;type&q;:&q;chapterpdf&q;,&q;size&q;:88463,&q;location&q;:null},{&q;_id&q;:&q;29a69e75-e8d3-450e-9d30-33b23b3b074f&q;,&q;type&q;:&q;coverimage&q;,&q;size&q;:71029,&q;location&q;:&q;https://images.tandf.co.uk/common/jackets/crclarge/978100305/9781003051923.jpg&q;},{ n-ended comments and conducted a qualitative content analysis. By using Krippendorf’s content analysis procedures (1989) and applying Bolman and Deal’s (2017) structural frame about organizations, I examined the human resources personnel’s remarks to address the central research question for this study was: RQ 1 &l;italic&g;What are the common insights that human resources personnel offer regarding workplace bullying on their perspective campuses?&l;/italic&g;\n                     &l;/p&g;\n                     &l;p&g;The qualitative content analysis lead to four themes: Theme #1—Leadership is Key; Theme #2—Lacking Training; Theme #3—Reflection on Law/Policy; and Theme #4—Faculty Abuse of Tenure. Considering these four themes, the cumulative commentary is that a cogent higher education structure has leadership that will empower human resources to engage and conduct training for themselves and supervisors. Resultantly, the organization could be proactive in avoiding lawsuits that materialize from bullying and instead cultivate a work environment where even tenured faculty are coached to avoid aggressive and disrespectful work behaviors.&l;/p&g;&q;}],&q;citation&q;:&q;&q;,&q;textType&q;:&q;Monograph (DRM-Free)&q;},&q;identifiers&q;:{&q;doi&q;:&q;10.4324/9781003051923-4&q;,&q;chapterId&q;:&q;chapter2&q;,&q;sku&q;:null},&q;label&q;:&q;2&q;,&q;pageStart&q;:&q;25&q;,&q;pageEnd&q;:&q;40&q;,&q;parentId&q;:&q;90b6d852-22cc-4864-9781-37144e7f1a2a&q;,&q;isFree&q;:false,&q;associatedMedia&q;:[{&q;_id&q;:&q;93f5e8b3-27c5-4947-9427-16bc9b7b5ccc&q;,&q;type&q;:&q;chapterabstractxml&q;,&q;size&q;:1841,&q;location&q;:null},{&q;_id&q;:&q;95a7a4a3-d9d6-435e-a939-5713733e78d0&q;,&q;type&q;:&q;chapterabstractxml&q;,&q;size&q;:1149,&q;location&q;:null},{&q;_id&q;:&q;04cbad0e-71b0-4867-bd31-3a7ca65f0d86&q;,&q;type&q;:&q;chapterpdf&q;,&q;size&q;:98142,&q;location&q;:null},{&q;_id&q;:&q;5133f4ed-ad43-4340-8b12-441ee4d4afa0&q;,&q;type&q;:&q;coverimage&q;,&q;size&q;:71029,&q;location&q;:&q;ht mid wield the most power. With power clustered at the top of an organizational chart, reasonably, one might believe that departments located closer to the top have more authority in creating change and intervention. Hence, the central research question for this chapter is “Are the instances of reported workplace bullying associated with the human resources department’s organizational placement in the institution?” With n = 165 for this analysis, a Chi-Square analysis confirmed a nominal difference in the number of workplace bullying complaints about institutions that had human resources departments that reported to the president when compared to human resources departments that reported to a vice president. The discussion and recommendations, with this finding in mind, suggest that while the organizational position of human resources departments is inconsequential, the emotional intelligence of executive leaders is probably more efficacious in attempts to quell workplace bullying in higher education.&l;/p&g;&q;}],&q;citation&q;:&q;&q;,&q;textType&q;:&q;Monograph (DRM-Free)&q;},&q;identifiers&q;:{&q;doi&q;:&q;10.4324/9781003051923-5&q;,&q;chapterId&q;:&q;chapter3&q;,&q;sku&q;:null},&q;label&q;:&q;3&q;,&q;pageStart&q;:&q;41&q;,&q;pageEnd&q;:&q;56&q;,&q;parentId&q;:&q;90b6d852-22cc-4864-9781-37144e7f1a2a&q;,&q;isFree&q;:false,&q;associatedMedia&q;:[{&q;_id&q;:&q;b16b773c-ec6e-42e8-80a8-375c49d9809f&q;,&q;type&q;:&q;chapterabstractxml&q;,&q;size&q;:1361,&q;location&q;:null},{&q;_id&q;:&q;00b92eb9-cb95-4d4f-ab76-26f2ee6aec46&q;,&q;type&q;:&q;chapterpdf&q;,&q;size&q;:103409,&q;location&q;:null},{&q;_id&q;:&q;80d586a2-9c2c-44f9-8e5d-369c8f7ffbab&q;,&q;type&q;:&q;coverimage&q;,&q;size&q;:71029,&q;location&q;:&q;https://images.tandf.co.uk/common/jackets/crclarge/978100305/9781003051923.jpg&q;},{&q;_id&q;:&q;63fc88f1-1b56-4859-8bdc-0f4095f8fe36&q;,&q;type&q;:&q;dbitsxml&q;,&q;size&q;:130032,&q;location&q;:null}],&q;level&q;:2,&q;position&q;:3,&q;availability&q;:[{&q;name&q;:& text&q;:&q;Ready For Market&q;,&q;type&q;:&q;sales&q;,&q;description&q;:null,&q;validTo&q;:null,&q;validFrom&q;:null},{&q;name&q;:&q;EBRALL&q;,&q;code&q;:&q;EBRALL&q;,&q;text&q;:&q;Institutional, retail and Atypon&q;,&q;type&q;:&q;access&q;,&q;description&q;:null,&q;validTo&q;:null,&q;validFrom&q;:null}],&q;audience&q;:[],&q;chapter&q;:{&q;pageStart&q;:&q;57&q;,&q;pageEnd&q;:&q;72&q;,&q;label&q;:&q;4&q;,&q;license&q;:{&q;type&q;:null,&q;description&q;:null,&q;location&q;:null},&q;fundingGroups&q;:[{&q;fundingStatement&q;:null,&q;awardGroupDetails&q;:[{&q;name&q;:&q;funderName&q;,&q;value&q;:null}]}],&q;groupOfCompany&q;:&q;OBB&q;,&q;podSuitable&q;:false,&q;subtitle&q;:&q;When Workplace Bullying Evolves into Legal Complaints&q;,&q;description&q;:null,&q;publisherImprint&q;:&q;Routledge&q;,&q;publicationDate&q;:&q;2021-05-12T00:00:00.000Z&q;,&q;copyright&q;:{},&q;edition&q;:1,&q;doiRegistrationStatus&q;:false,&q;firstPublishedYear&q;:&q;2021&q;,&q;plannedPublicationDate&q;:&q;2021-05-13T00:00:00.000Z&q;,&q;inLanguage&q;:&q;eng&q;,&q;abstracts&q;:[{&q;type&q;:&q;xml&q;,&q;position&q;:0,&q;caption&q;:null,&q;transcript&q;:null,&q;textType&q;:&q;abstract&q;,&q;value&q;:&q;&l;p&g;Scholars and employees across the United States recognize that workplace bullying remains legal unless the aggressive behavior can be tied to a protected class status under Title VII. A few states have adopted legislation prohibiting workplace bullying. However, these laws do not allow employees to take independent legal action while the employer is granted immunity for having policies or an occasional training. The conspicuous assumption remains that workplace bullying is not actionable in the legal system. What employers may overlook is the real possibility that a target of workplace bullying can align workplace bullying behaviors with Civil Rights violations, whistleblower violations, Title IX violations, and federally prohibited behaviors. Simultaneously, management may hinder human resources from curbing workplace bullying despite the legal hazard to organizations when the complainant can link workplace bullying with an illegal federal employment law.&l;/p&g;\n                     &l;p&g;To analyze the association between workplace bullying and illegal behavior in American higher education, I used a theoretical framework of Ignorance Theory. Also, I have incorporated two data sets for this chapter. First, I analyzed responses from higher education human resources and diversity officers, n = 215, to confirm a statistically significant finding that increased internal complaints regarding workplace bullying are more likely to lead to external complaints to the EEOC, OCR, Department of Labor, Whistleblower agency or state-level human rights commission. Also, I have included data collected from HBCU faculty members, n = 351, of all ranks from 45 institutions across 15 states to confirm that workplace bullies were more likely to engage illegal behavior. For collegiate institutions that neglect workplace bullying disputes with the presupposition that workplace bullying is not actionable, the data analyses confirm that even without a direct pathway to a legal complaint, targets of workplace bullying can successfully include workplace bullying behaviors in legal complaints claiming retaliation and other organization transgressions that are rooted in structural inadequacies.&l;/p&g;&q;}],&q;citation&q;:&q;&q;,&q;textType&q;:&q;Monograph (DRM-Free)&q;},&q;identifiers&q;:{&q;doi&q;:&q;10.4324/9781003051923-6&q;,&q;chapterId&q;:&q;chapter4&q;,&q;sku&q;:null},&q;label&q;:&q;4&q;,&q;pageStart&q;:&q;57&q;,&q;pageEnd&q;:&q;72&q;,&q;parentId&q;:&q;90b6d852-22cc-4864-9781-37144e7f1a2a&q;,&q;isFree&q;:false,&q;associatedMedia&q;:[{&q;_id&q;:&q;0cec520e-9128-499f-9575-2a437f39c2b1&q;,&q;type&q;:&q;chapterabstractxml&q;,&q;size&q;:2293,&q;location&q;:null},{&q;_id&q;:&q;6f044031-0fbe-4346-bf05-490bb7ce7889&q;,&q;type&q;:&q;chapterabstractxml&q;,&q;size&q;:1151,&q;location&q q;&l;p&g;The Ombuds position through history operates independent of the executives to internally address complaints from a neutral position. With the informal latitude across an organization, the Ombuds can broker remedies within the bounds of organizational policy and procedures. Specifically, in higher education, the Ombuds position reasonably should be able to resolve conflict emerging from workplace bullying. Therefore, applying a conceptual framework of self-determination and employee mobilization and with n=174, I implemented a chi-square analysis to address the two central research questions: RQ1: &l;italic&g;With internal complaints at or above the median of three complaints annually, will colleges and universities with an Ombuds presence have employees less likely to file internal complaints?&l;/italic&g; And RQ2: &l;italic&g;With external complaints at or above the median of three complaints annually, will colleges and universities with an Ombuds presence have employees less likely to file complaints to external agencies?&l;/italic&g; Both chi-square tests reveal that the respondents in this study did not experience fewer complaints internally or externally because of an Ombuds’ presence on campus. The discussion explores possible intervening factors that might have contributed to these findings.&l;/p&g;&q;}],&q;citation&q;:&q;&q;,&q;textType&q;:&q;Monograph (DRM-Free)&q;},&q;identifiers&q;:{&q;doi&q;:&q;10.4324/9781003051923-7&q;,&q;chapterId&q;:&q;chapter5&q;,&q;sku&q;:null},&q;label&q;:&q;5&q;,&q;pageStart&q;:&q;73&q;,&q;pageEnd&q;:&q;86&q;,&q;parentId&q;:&q;90b6d852-22cc-4864-9781-37144e7f1a2a&q;,&q;isFree&q;:false,&q;associatedMedia&q;:[{&q;_id&q;:&q;182c155d-eaeb-40db-b99c-17073ff6eb50&q;,&q;type&q;:&q;chapterabstractxml&q;,&q;size&q;:1399,&q;location&q;:null},{&q;_id&q;:&q;b4cfbfc8-a789-4d8b-a62b-e2661f5d4726&q;,&q;type&q;:&q;chapterpdf&q;,&q;size&q;:87347,&q;location&q;:null},{&q;_id&q;:&q;8741b593-f01f-458e-9a53-9d3a99e2ea9d&q;,&q;type&q;:&q;cove  problem creating deleterious issues for the target enduring the abuse and for the organization standing mute when workplace bullying is reported. The most recent analysis reported that 58% of higher education respondents are affected by workplace bullying (Hollis, 2018) and a meta-analysis of data collected in 2012, 2014, 2016 and 2018 shows that 61% of all American higher education respondents are affected by workplace bullying. Faculty bullies have different styles such as the ill-tempered curmudgeon, the restrictive and punitive Procrustes figure, and the envious Snow White type. Though workplace bullying may have myriad of figures, bullies’ unchecked behavior hurts academic departments.&l;/p&g;\n                     &l;p&g;This essay utilizes Brown and Mitchell’s (2010) ethical leadership theory to reflect on leadership in light some recent workplace bullying and harassment cases reported in &l;italic&g;The Chronicle of Higher Education&l;/italic&g;. Workplace bullying among the faculty mushrooms when the curmudgeon, the Procrustes figure, and the Snow White weld their power without interruption, creating precarity, that is an unstable work environment, for all involved. Regardless of the style of bullying, or the target as colleagues or students, the cases from &l;italic&g;The Chronicle &l;/italic&g;point to the common denominator, an apathetic leadership, which permits this abuse for years, culminating in fractured careers and public lawsuits.&l;/p&g;&q;}],&q;citation&q;:&q;&q;,&q;textType&q;:&q;Monograph (DRM-Free)&q;},&q;identifiers&q;:{&q;doi&q;:&q;10.4324/9781003051923-9&q;,&q;chapterId&q;:&q;chapter6&q;,&q;sku&q;:null},&q;label&q;:&q;6&q;,&q;pageStart&q;:&q;93&q;,&q;pageEnd&q;:&q;109&q;,&q;parentId&q;:&q;0d40ea9a-143d-4049-b819-7eb16c5312a8&q;,&q;isFree&q;:false,&q;associatedMedia&q;:[{&q;_id&q;:&q;4581496b-8221-4a37-8707-e16fcfc53917&q;,&q;type&q;:&q;chapterabstractxml&q;,&q;size&q;:1609,&q;location&q;:null},{&q;_id&q;:&q;e2a709a3-7f7f-4227-a60a-e866704 LPSYCH-XX21&q;},&q;subType&q;:&q;Sales Collection&q;},{&q;_id&q;:&q;9ac308c4-13ab-4083-9e83-a04974856347&q;,&q;type&q;:&q;collection&q;,&q;level&q;:1,&q;position&q;:5890,&q;title&q;:&q;Educational Foundations &a; Education Studies XX21&q;,&q;identifiers&q;:{&q;collectionId&q;:&q;HSS-EDFOUND-XX21&q;},&q;subType&q;:&q;Sales Collection&q;},{&q;_id&q;:&q;bc456898-fd97-45fe-8792-f4d09fe8d675&q;,&q;type&q;:&q;collection&q;,&q;level&q;:1,&q;position&q;:42717,&q;title&q;:&q;Monographs Collection&q;,&q;identifiers&q;:{&q;sku&q;:&q;01taA000008ruyjQAA&q;,&q;collectionId&q;:&q;SAL-MONOGRAPHS&q;},&q;subType&q;:null}],&q;permissions&q;:[{&q;name&q;:&q;rfm&q;,&q;code&q;:&q;CTMRFM&q;,&q;text&q;:&q;Ready For Market&q;,&q;type&q;:&q;sales&q;,&q;description&q;:null,&q;validTo&q;:null,&q;validFrom&q;:null},{&q;name&q;:&q;EBRALL&q;,&q;code&q;:&q;EBRALL&q;,&q;text&q;:&q;Institutional, retail and Atypon&q;,&q;type&q;:&q;access&q;,&q;description&q;:null,&q;validTo&q;:null,&q;validFrom&q;:null}],&q;audience&q;:[],&q;chapter&q;:{&q;pageStart&q;:&q;110&q;,&q;pageEnd&q;:&q;127&q;,&q;label&q;:&q;7&q;,&q;license&q;:{&q;type&q;:null,&q;description&q;:null,&q;location&q;:null},&q;fundingGroups&q;:[{&q;fundingStatement&q;:null,&q;awardGroupDetails&q;:[{&q;name&q;:&q;funderName&q;,&q;value&q;:null}]}],&q;groupOfCompany&q;:&q;OBB&q;,&q;podSuitable&q;:false,&q;subtitle&q;:&q;Black Women’s Additional Risk: Facing “Mobbing” in Higher Education&q;,&q;description&q;:null,&q;publisherImprint&q;:&q;Routledge&q;,&q;publicationDate&q;:&q;2021-05-12T00:00:00.000Z&q;,&q;copyright&q;:{},&q;edition&q;:1,&q;doiRegistrationStatus&q;:false,&q;firstPublishedYear&q;:&q;2021&q;,&q;plannedPublicationDate&q;:&q;2021-05-13T00:00:00.000Z&q;,&q;inLanguage&q;:&q;eng&q;,&q;abstracts&q;:[{&q;type&q;:&q;xml&q;,&q;position&q;:0,&q;caption&q;:null,&q;transcript&q;:null,&q;textType&q;:&q;abstract&q;,&q;value&q;:&q;&l;p&g;In the last decade, some researchers have turned their attention to workplace bullying in American higher education. Such abusive and corrosive behaviors not only demoralize faculty and staff, but also disproportionately affect women and people of color. The workplace bullying literature also includes discussions on &s;mobbing,&s; which for the purpose of this chapter’s study is a group of bullies abusing a single target. With the knowledge that women and people of color are more likely to deal with workplace bullying in higher education, I am extending the literature to analyze if white women and Black women are more likely to face mobbing in higher education. With n =117 Black women and white women assistant professors, the research questions that guided this study were: RQ1: &l;italic&g;Are Black women assistant professors or white women assistant professors more likely to face mobbing from other women?.&l;/italic&g; and RQ2: &l;italic&g;Are Black women assistant professors or white women professors more likely to face workplace mobbing from men?&l;/italic&g;\n                     &l;/p&g;\n                     &l;p&g;After examining historical and contemporary manifestations of mobbing for Black women, I used a chi-square analysis to examine if this phenomenon occurs for junior women faculty. The chi-square analysis confirmed that Black women assistant professors are more likely to be mobbed by women that white women assistant professors. The finding is at a statistically significant level X2 (1, N=117) = 6.359 p=.012, yet there was a negligible difference of mobbing instances for Black and white women when the bullies were men.&l;/p&g;&q;}],&q;citation&q;:&q;&q;,&q;textType&q;:&q;Monograph (DRM-Free)&q;},&q;identifiers&q;:{&q;doi&q;:&q;10.4324/9781003051923-10&q;,&q;chapterId&q;:&q;chapter7&q;,&q;sku&q;:null},&q;label&q;:&q;7&q;,&q;pageStart&q;:&q;110&q;,&q;pageEnd&q;:&q;127&q;,&q;parentId&q;:&q;0d40ea9a-143d-4049-b819-7eb16c5312a8&q;,&q;isFree&q;:false,&q;associatedMedia&q;:[{&q;_id&q;:&q;63864fd2-7bb0-493f-ba10-5b993344f8a4&q;,&q;type&q;:&q;chapterabstractxml&q;,&q;si ed themselves to openly resisting workplace violence and aggression through the #MeToo and #TimesUp movements. Women’s activism has led to convictions in high-profile lawsuits against Bill Cosby and Harvey Weinstein. While these are hallmark victories in women’s rights activism, these lawsuits only addressed sexual harassment; yet women still deal with other workplace problems with gender discrimination, pay inequities, and workplace bullying. Some researchers have confirmed that workplace bullying is a gendered phenomenon (Drabek &a;amp; Merecz, 2013; &l;xref ref-type=\&q;bibr\&q; rid=\&q;TNFUK-CH008_CIT00068\&q;&g;Simpson &a;amp; Cohen, 2004&l;/xref&g;), one that I arguably state diminishes a woman’s self-determination in establishing and maintaining a career trajectory. Therefore, using self-determination theory, I will consider the central research question: RQ1: &l;italic&g;Are women higher education employees or men higher education employees more likely to leave a higher education position as a result of workplace bullying?&l;/italic&g;\n                     &l;/p&g;\n                     &l;p&g;I collected data in this chapter during the winter of 2018 resulting in 588 responses. Of this sample, 424 were women and 164 were men. I utilized a chi-square analysis to determine which gender was more likely to adopt turnover intentions as a coping strategy in response to workplace bullying. The findings confirmed a statistical significance at the P&a;lt; .01 level that women are more likely to engage in turnover intention as a result of workplace bullying in higher education. These findings not only elucidate a problematic trend for women’s career planning, but turnover is also costly to organizational stability.&l;/p&g;&q;}],&q;citation&q;:&q;&q;,&q;textType&q;:&q;Monograph (DRM-Free)&q;},&q;identifiers&q;:{&q;doi&q;:&q;10.4324/9781003051923-11&q;,&q;chapterId&q;:&q;chapter8&q;,&q;sku&q;:null},&q;label&q;:&q;8&q;,&q;pageStart&q;:&q;128&q;,&q;pageEnd&q;:&q;146&q;, anguage&q;:&q;eng&q;,&q;abstracts&q;:[{&q;type&q;:&q;xml&q;,&q;position&q;:0,&q;caption&q;:null,&q;transcript&q;:null,&q;textType&q;:&q;abstract&q;,&q;value&q;:&q;&l;p&g;As researchers have increasingly examined the workplace bullying issue in higher education, the field has not benefited from an analysis that considers if faculty mentoring can assuage junior faculty member’s perception of a workplace bully. As entry-level faculty, regardless of the institutional type, assistant professors are one of the more vulnerable populations on campus because they are at the whims of senior faculty who will vote for their tenure. Applying the family systems theory to the junior faculty experience and mentoring, I considered the following central question: RQ1 What aspects of faculty mentoring, (the mentor&s;s time spent with a mentee (IV1), mentor&s;s knowledge as faculty (IV2), mentor&s;s career support (IV3), mentor&s;s impact on mentee&s;s productivity (IV4), and mentor&s;s counsel of personal matters (IV5)), and the intensity of workplace bullying that junior faculty perceive. With n= 128 junior faculty, a multiple regression analysis of the five independent variables revealed a statistical significance at the p &a;lt;. 05 level, that the mentor’s knowledge of the faculty experience helped to minimize the junior faculty’s perception of workplace bullying. The findings of this chapter strengthen the argument for both formal and informal mentor/mentee networks for junior faculty development.&l;/p&g;&q;}],&q;citation&q;:&q;&q;,&q;textType&q;:&q;Monograph (DRM-Free)&q;},&q;identifiers&q;:{&q;doi&q;:&q;10.4324/9781003051923-12&q;,&q;chapterId&q;:&q;chapter9&q;,&q;sku&q;:null},&q;label&q;:&q;9&q;,&q;pageStart&q;:&q;147&q;,&q;pageEnd&q;:&q;164&q;,&q;parentId&q;:&q;0d40ea9a-143d-4049-b819-7eb16c5312a8&q;,&q;isFree&q;:false,&q;associatedMedia&q;:[{&q;_id&q;:&q;ed3d9371-ed25-4d1a-acc7-251389dcd6fb&q;,&q;type&q;:&q;chapterabstractxml&q;,&q;size&q;:1424,&q;location&q;:null},{&q;_id&q ucational Foundations &a; Education Studies XX21&q;,&q;identifiers&q;:{&q;collectionId&q;:&q;HSS-EDFOUND-XX21&q;},&q;subType&q;:&q;Sales Collection&q;},{&q;_id&q;:&q;bc456898-fd97-45fe-8792-f4d09fe8d675&q;,&q;type&q;:&q;collection&q;,&q;level&q;:1,&q;position&q;:42717,&q;title&q;:&q;Monographs Collection&q;,&q;identifiers&q;:{&q;sku&q;:&q;01taA000008ruyjQAA&q;,&q;collectionId&q;:&q;SAL-MONOGRAPHS&q;},&q;subType&q;:null}],&q;permissions&q;:[{&q;name&q;:&q;rfm&q;,&q;code&q;:&q;CTMRFM&q;,&q;text&q;:&q;Ready For Market&q;,&q;type&q;:&q;sales&q;,&q;description&q;:null,&q;validTo&q;:null,&q;validFrom&q;:null},{&q;name&q;:&q;EBRALL&q;,&q;code&q;:&q;EBRALL&q;,&q;text&q;:&q;Institutional, retail and Atypon&q;,&q;type&q;:&q;access&q;,&q;description&q;:null,&q;validTo&q;:null,&q;validFrom&q;:null}],&q;audience&q;:[],&q;chapter&q;:{&q;pageStart&q;:&q;165&q;,&q;pageEnd&q;:&q;184&q;,&q;label&q;:&q;10&q;,&q;license&q;:{&q;type&q;:null,&q;description&q;:null,&q;location&q;:null},&q;fundingGroups&q;:[{&q;fundingStatement&q;:null,&q;awardGroupDetails&q;:[{&q;name&q;:&q;funderName&q;,&q;value&q;:null}]}],&q;groupOfCompany&q;:&q;OBB&q;,&q;podSuitable&q;:false,&q;subtitle&q;:&q;A Chi-Squared Confirmation that Workplace Cyberbullying Disproportionally Affects People of Color and the LGBQ Community in Higher Education&q;,&q;description&q;:null,&q;publisherImprint&q;:&q;Routledge&q;,&q;publicationDate&q;:&q;2021-05-12T00:00:00.000Z&q;,&q;copyright&q;:{},&q;edition&q;:1,&q;doiRegistrationStatus&q;:false,&q;firstPublishedYear&q;:&q;2021&q;,&q;plannedPublicationDate&q;:&q;2021-05-13T00:00:00.000Z&q;,&q;inLanguage&q;:&q;eng&q;,&q;abstracts&q;:[{&q;type&q;:&q;xml&q;,&q;position&q;:0,&q;caption&q;:null,&q;transcript&q;:null,&q;textType&q;:&q;abstract&q;,&q;value&q;:&q;&l;p&g;Several studies have considered cyberbullying for primary and secondary students. A few studies have considered cyberbullying between college students, yet a recent search in ProQuest and EBSCOHost revealed less than five articles of adult cyber bullying in higher education. Hence, adult cyberbullying continues to be an understudied problem in higher education. The sample of higher education professionals and faculty members were collected (N = 578) in late 2017/early 2018, in which 45% of respondents reported they were targets of cyberbullying in higher education. Respondents reported cyberbullying through emails, social media, and texting from colleagues in their higher education work environment. This chapter’s study applied social dominance theory in an examination of whether women, people of color, and the LGBQ community reported more incidents of cyber bullying. A chi-square analysis confirmed a statistical significance, at the P&a;lt; .01 level, that both people of color and members of the LGBQ community are more likely to be targets of cyber bullying in higher education. However, despite the literature, which reports that women are more likely to endure cyberharassment, gender in this study was not confirmed as a compelling element on who was more likely to endure cyberbullying in higher education.&l;/p&g;&q;}],&q;citation&q;:&q;&q;,&q;textType&q;:&q;Monograph (DRM-Free)&q;},&q;identifiers&q;:{&q;doi&q;:&q;10.4324/9781003051923-13&q;,&q;chapterId&q;:&q;chapter10&q;,&q;sku&q;:null},&q;label&q;:&q;10&q;,&q;pageStart&q;:&q;165&q;,&q;pageEnd&q;:&q;184&q;,&q;parentId&q;:&q;0d40ea9a-143d-4049-b819-7eb16c5312a8&q;,&q;isFree&q;:false,&q;associatedMedia&q;:[{&q;_id&q;:&q;f280a08a-dfbd-4d69-8535-e8c53effb945&q;,&q;type&q;:&q;chapterabstractxml&q;,&q;size&q;:1424,&q;location&q;:null},{&q;_id&q;:&q;54a10305-03cd-4e1e-9c0a-a9ed3e26664e&q;,&q;type&q;:&q;chapterpdf&q;,&q;size&q;:262879,&q;location&q;:null},{&q;_id&q;:&q;ac59361c-2843-4089-8e9e-5c0d79836b76&q;,&q;type&q;:&q;coverimage&q;,&q;size&q;:71029,&q;location&q;:&q;https://images.tandf.co.uk/common/jackets/crclarge/978100305/9781003051923.jpg&q;},{&q;_id&q;:&q;a5f06e2d-91e3-4421-a300-82e91165f73f&q;,&q;type&q;:&q;dbitsxml&q;,&q;size&q;:
