y:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased}</style></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"session":null,"pageProps":{"key":"3546","insightId":"3546","insightSlug":"creative-with-credit-how-banks-can-assist-people-with-disabilities","response":"{\"id\":3546,\"title\":\"Creative with credit: How banks can assist people with disabilities\",\"content\":\"\u003cp\u003e\u003ci\u003ePeople with disabilities are a growing segment of the US and global population—and workforce. This series examines the ways in which banks can use equity-centered design to help elevate the financial wellbeing of people with disabilities.\u0026nbsp;\u003c/i\u003e\u003c/p\u003e\u003chr\u003e\u003cp style=\\\"text-align:center;\\\"\u003e\u003cbr\u003e\u003cspan style=\\\"color:hsl(198,100%,35%);\\\"\u003e\u003cstrong\u003eListen to article\u003c/strong\u003e\u003c/span\u003e\u003cbr\u003eaudio:[\u003cspan style=\\\"background-color:rgb(246,246,249);color:rgb(0,0,0);font-family:-apple-system, BlinkMacSystemFont, \u0026quot;Segoe UI\u0026quot;, Roboto, Oxygen, Ubuntu, Cantarell, \u0026quot;Open Sans\u0026quot;, \u0026quot;Helvetica Neue\u0026quot;, sans-serif;\\\"\u003ehttps://d1lzrgdbvkolkd.cloudfront.net/3546_Audio_4b4ed81dbe.mp3\u003c/span\u003e]\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003ch2\u003eEasier access to credit\u003c/h2\u003e\u003cp\u003eAccess to credit can be a pervasive challenge among people with disabilities. A respondent to a Deloitte Center for Financial Services survey reported the experience of obtaining credit can often be \\\"degrading.\\\" More than four in five people with disabilities in the survey reported carrying debt in their name. Whether due to a poor credit record or insufficient income, 40 percent of people with disabilities in the survey were also denied new credit.\u003c/p\u003e\u003cp\u003ePeople with disabilities are some of the heaviest users of payday lenders, who charge exorbitantly high interest rates. The vicious cycle of debt, at least for some people with disabilities, can be difficult to escape.\u003c/p\u003e\u003ch2\u003e\u003cbr\u003eBanking regulations protect people with disabilities against credit discrimination\u003c/h2\u003e\u003cp\u003eRegulations play a key role in helping to ensure people with disabilities receive fair access to banking services and credit opportunities. In the United States, there are multiple federal and state statutes that implicitly or explicitly prohibit credit discrimination and unfair lending practices on the basis of disability.\u003c/p\u003e\u003cp\u003eThe Community Reinvestment Act (CRA), for instance, encourages financial institutions to help meet the credit needs of the communities where they operate, including low- and moderate-income neighborhoods.\u003csup\u003e1\u003c/sup\u003e Similarly, the Equal Credit Opportunity Act (ECOA) stipulates that banks should not discriminate against those who receive federal disability assistance, such as Social Security Disability Insurance.\u003csup\u003e2\u003c/sup\u003e\u003c/p\u003e\u003cp\u003eDespite these laws, credit discrimination against people with disabilities is a persistent problem in American society. For instance, in 2021, nearly 58 percent of discrimination complaints filed with the Department of Housing and Urban Development were on the basis of disability.\u003csup\u003e3\u003c/sup\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cfigure class=\\\"image image-style-align-center\\\"\u003e\u003cimg src=\\\"https://d1lzrgdbvkolkd.cloudfront.net/3546_F01_78d884d95f.gif\\\" alt=\\\"3546_F01.gif\\\"\u003e\u003c/figure\u003e\u003ch2\u003e\u003cbr\u003eProviding credit through innovative credit products and flexible pricing\u003c/h2\u003e\u003cp\u003eNew products and innovative pricing to serve the unique needs of people with disabilities and others with similar financial needs could be a clear opportunity for banks. Health care-related loans that incorporate elements of microloans or buy-now-pay-later (BNPL) loans, such as instant credit and flexible payment terms, should be received favorably by people with disabilities and their families. These programs, along with timely payment nudges, may also help improve their credit history and build their credit scores.\u003c/p\u003e\u003cp\u003eAt the same time, introducing credit products that enable borrowers to pay with their disability income should be welcomed. Banks may need more creative solutions that promote affordable and accessible lending. Moreover, people with disabilities meeting the eligibility criteria could also benefit from this affordable loan solution program.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cfigure class=\\\"table\\\"\u003e\u003ctable style=\\\"background-color:hsl(0, 0%, 90%);\\\"\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003ch2\u003e\u003cstrong\u003eGo Deeper\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eLearn more about delivering banking experiences that meet the needs of people with disabilities\u003cspan style=\\\"color:rgb(31,31,31);\\\"\u003e:\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003ca href=\\\"https://www2.deloitte.com/content/dam/insights/articles/us176079_cfs_banking-for-people-with-disabilities/DI_How-can-banks-better-serve-people-with-disabilities-and-why-the-time-is-now.pdf\\\"\u003e\u003cspan style=\\\"color:hsl(196,100%,44%);\\\"\u003e\u003ci\u003eHow can banks better serve people with disabilities, and why the time is now\u003c/i\u003e\u003c/span\u003e\u003c/a\u003e, Deloitte Insights / Jon Valenti et al., 2023.\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\u003ch3\u003e\u003cbr\u003e\u003cstrong\u003eFootnotes:\u003c/strong\u003e\u003c/h3\u003e\u003col style=\\\"list-style-type:decimal;\\\"\u003e\u003cli\u003e\u003ci\u003eReforming the C
